<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dP Checklisten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&family=Poppins:wght@600;700&display=swap" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar no-print">
      <div class="logo">
        <span class="dot">dP</span>
        <span>Checklisten</span>
        <span class="version-tag" id="versionTag"></span>
      </div>
      <div class="crumbs" id="crumbs"></div>
      <div class="spacer"></div>
      <div class="actions" id="topActions"></div>
    </header>
    <main class="main" id="view"></main>
  </div>
  <!-- Cache-bust JS assets on every page load (dev). Production should swap in proper hashing. -->
  <script>
    (function(){
      var v = Date.now();
      function add(src){ var s = document.createElement('script'); s.src = src + '?v=' + v; s.async = false; document.body.appendChild(s); }
      add('api.js'); add('app.js');
    })();
  </script>
</body>
</html>
